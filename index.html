<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Snake 3 | LincolnSoft</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
  </head>
  <body>
    <!-- LincolnSoft WebGL-Template: Kopfleiste mit Rückweg zur Homestation, Spiel füllt den Rest -->
    <header id="ls-bar">
      <a id="ls-home" class="ls-btn" href="https://lincolnsoft.de/" title="Zurück zur Lincolnsoft Homestation"><span class="ls-ico">⌂</span><span class="ls-label">BACK TO HOMESTATION</span></a>
      <div id="ls-title">
        <span class="ls-name">Snake 3</span>
        <span class="ls-version">ALPHA 0.6.2</span>
      </div>
      <button id="ls-fullscreen" class="ls-btn" type="button" title="Vollbild"><span class="ls-ico">⛶</span><span class="ls-label">VOLLBILD</span></button>
    </header>

    <!-- Info-Leiste: Tastenbelegung links, Musik-Umschaltung rechts -->
    <nav id="ls-info" aria-label="Steuerung">
      <ul id="ls-keys">
        <li><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> / <kbd>←</kbd><kbd>↑</kbd><kbd>↓</kbd><kbd>→</kbd> Lenken</li>
        <li><kbd>Esc</kbd> / <kbd>P</kbd> Pause</li>
        <li><kbd>R</kbd> Neustart</li>
        <li><kbd>M</kbd> Musik</li>
        <li><kbd>L</kbd> Bestenliste</li>
      </ul>
      <div id="ls-music" role="group" aria-label="Musik">
        <span class="ls-music-label">♪ MUSIK</span>
        <button type="button" data-style="Techno" data-idx="0" disabled>TECHNO</button>
        <button type="button" data-style="Metal" data-idx="1" disabled>METAL</button>
        <button type="button" data-style="Off" data-idx="2" disabled>AUS</button>
      </div>
    </nav>

    <main id="unity-container">
      <canvas id="unity-canvas" width=960 height=600 tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div class="ls-loading-title">LADE Snake 3</div>
        <div id="unity-progress-bar-empty"><div id="unity-progress-bar-full"></div></div>
        <div id="ls-loading-pct">0 %</div>
      </div>
      <div id="unity-warning"></div>
    </main>

    <script>
      // ---- Musik-Umschaltung: Seite → Spiel per SendMessage, Spiel → Seite per lsOnMusicStyle (Snake3Web.jslib)
      var unityRef = null;
      var musicButtons = document.querySelectorAll("#ls-music button");
      window.lsOnMusicStyle = function (idx) {
        musicButtons.forEach(function (b) { b.setAttribute("aria-pressed", String(+b.dataset.idx === idx)); });
      };
      musicButtons.forEach(function (b) {
        b.addEventListener("click", function () {
          if (!unityRef) return;
          unityRef.SendMessage("Music", "SetStyleFromWeb", b.dataset.style);
          window.lsOnMusicStyle(+b.dataset.idx);   // sofort anzeigen, das Spiel bestätigt per Callback
          canvas.focus();                           // Tastatur bleibt beim Spiel
        });
      });

      // Auf lincolnsoft.de relativ zur Startseite, sonst (GitHub Pages / itch.io) absolut.
      if (/(^|\.)lincolnsoft\.de$/.test(location.hostname)) document.getElementById("ls-home").href = "/";

      var canvas = document.querySelector("#unity-canvas");
      var container = document.querySelector("#unity-container");
      var ASPECT = 960 / 600;

      // Canvas so groß wie möglich im freien Bereich, Seitenverhältnis bleibt erhalten.
      function fitCanvas() {
        var cs = getComputedStyle(container);
        var w = container.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
        var h = container.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
        if (w / h > ASPECT) w = Math.floor(h * ASPECT); else h = Math.floor(w / ASPECT);
        canvas.style.width = w + "px";
        canvas.style.height = h + "px";
      }
      window.addEventListener("resize", fitCanvas);
      fitCanvas();

      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? "block" : "none";
        }
        var div = document.createElement("div");
        div.textContent = msg;
        div.className = "ls-banner ls-banner--" + (type || "info");
        warningBanner.appendChild(div);
        if (type != "error") {
          setTimeout(function () { warningBanner.removeChild(div); updateBannerVisibility(); }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/WebGL.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/WebGL.data.unityweb",
        frameworkUrl: buildUrl + "/WebGL.framework.js.unityweb",
        codeUrl: buildUrl + "/WebGL.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "Snake 3",
        productVersion: "0.6.2",
        showBanner: unityShowBanner,
      };

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        document.body.classList.add("ls-mobile");
      }

      document.querySelector("#unity-loading-bar").style.display = "flex";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = function () {
        createUnityInstance(canvas, config, function (progress) {
          var pct = Math.round(100 * progress);
          document.querySelector("#unity-progress-bar-full").style.width = pct + "%";
          document.querySelector("#ls-loading-pct").textContent = pct + " %";
        }).then(function (unityInstance) {
          document.querySelector("#unity-loading-bar").style.display = "none";
          document.querySelector("#ls-fullscreen").onclick = function () { unityInstance.SetFullscreen(1); };
          unityRef = unityInstance;
          musicButtons.forEach(function (b) { b.disabled = false; });
          canvas.focus();
        }).catch(function (message) {
          unityShowBanner(String(message), "error");
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
